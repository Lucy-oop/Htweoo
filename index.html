    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both getter and setter so injected scripts can wrap it without throwing
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
