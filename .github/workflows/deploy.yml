name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        # GITHUB_PAGES switches the Vite base to /Htweoo/ so bundled asset URLs
        # resolve under the project subpath instead of the domain root.
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        # Pages has no rewrite rules, so a hard refresh on /Htweoo/about would
        # 404. Serving index.html as 404.html hands those URLs to the router.
        # .nojekyll stops Pages skipping underscore-prefixed files.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
